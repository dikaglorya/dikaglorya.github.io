<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 430" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">About Dika Glorya — floating terminal</title>
<desc id="svg-desc">A perspective-tilted 3D terminal card with typed command lines, a blinking cursor and floating wireframe cubes.</desc>
<defs>

<linearGradient id="card-face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6f8ff"/>
    <stop offset="0.5" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
<linearGradient id="card-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d0d7de" stop-opacity="0.9"/>
    <stop offset="0.6" stop-color="#c7d2fe" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#0891b2" stop-opacity="0.45"/>
  </linearGradient>
<radialGradient id="about-aura-a" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#8250df" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
  </radialGradient>
<radialGradient id="about-aura-b" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#0891b2" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
  </radialGradient>
<radialGradient id="scan-glow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#0891b2" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0891b2" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
  </radialGradient>
<filter id="about-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
    <feFlood flood-color="#0891b2" flood-opacity="1" result="tint"/>
    <feComposite in="tint" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
<filter id="cube-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feFlood flood-color="#8250df" flood-opacity="1.2" result="tint"/>
    <feComposite in="tint" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
<filter id="about-blur" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
<filter id="card-shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#22305a" flood-opacity="0.35"/>
  </filter>
<clipPath id="card-clip"><rect x="300" y="66" width="600" height="288" rx="22"/></clipPath>
<clipPath id="cube-clip"><rect x="0" y="0" width="1200" height="430"/></clipPath>
<clipPath id="line-0"><rect class="line-reveal" style="animation-delay:0.2s" x="342" y="137" width="520" height="27"/></clipPath>
<clipPath id="line-1"><rect class="line-reveal" style="animation-delay:0.45s" x="342" y="165" width="520" height="27"/></clipPath>
<clipPath id="line-2"><rect class="line-reveal" style="animation-delay:0.7s" x="342" y="201" width="520" height="27"/></clipPath>
<clipPath id="line-3"><rect class="line-reveal" style="animation-delay:0.95s" x="342" y="229" width="520" height="27"/></clipPath>
<clipPath id="line-4"><rect class="line-reveal" style="animation-delay:1.2s" x="342" y="265" width="520" height="27"/></clipPath>
<clipPath id="line-5"><rect class="line-reveal" style="animation-delay:1.45s" x="342" y="293" width="520" height="27"/></clipPath>
</defs>
<style><![CDATA[

text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'Courier New', 'DejaVu Sans Mono', monospace; }
.eyebrow { letter-spacing: 3.4px; }


.line-reveal { transform-box: fill-box; transform-origin: left center; animation: typeLine 0.55s steps(18) both; }
@keyframes typeLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.caret { animation: caret 1.05s steps(1, end) infinite; }
@keyframes caret { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
.card-float { animation: cardFloat 8s ease-in-out infinite; }
@keyframes cardFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-9px) rotate(0.35deg); } }
.back-float { animation: backFloat 11s ease-in-out infinite; }
@keyframes backFloat { 0%, 100% { transform: translateY(5px) rotate(0deg); } 50% { transform: translateY(-6px) rotate(-0.5deg); } }
.cube-a { animation: cubeFloat 9s ease-in-out infinite; }
.cube-b { animation: cubeFloat 12s ease-in-out -4s infinite; }
@keyframes cubeFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
.scan { animation: scan 7s ease-in-out infinite; }
@keyframes scan { 0%, 100% { transform: translateY(0); opacity: 0; } 12% { opacity: 0.55; } 65% { opacity: 0.55; } 80% { transform: translateY(200px); opacity: 0; } }


@media (prefers-reduced-motion: reduce) {
  .anim, .anim * { animation: none !important; }
  .smil { display: none !important; }
  .orb-motion { display: none !important; }
  .orb-static { display: block !important; }
  .sub-b, .sub-c { opacity: 0 !important; }
  .sub-a { opacity: 1 !important; }
  .count:not(.count-final) { display: none !important; }
  .count-final { opacity: 1 !important; }
  .cf-first { opacity: 1 !important; }
  .tile, .tile-shadow, .bar-clip, .footer-fade, .thanks { animation: none !important; }
}

]]></style>
<g class="anim">
  <ellipse cx="290" cy="210" rx="300" ry="190" fill="url(#about-aura-a)"/>
  <ellipse cx="920" cy="260" rx="290" ry="180" fill="url(#about-aura-b)"/>
  <ellipse cx="600" cy="397" rx="290" ry="24" fill="#22305a" opacity="0.2" filter="url(#about-blur)"/>

  <g class="back-float" opacity="0.55" filter="url(#about-blur)">
    <g transform="rotate(2.4 600 210)">
      <rect x="320" y="78" width="580" height="276" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-opacity="0.35"/>
    </g>
  </g>

  <g class="cube-a"><g opacity="0.8">
  <path d="M222,120 L252,150 L222,180 L192,150 Z" fill="#8250df"/>
  <path d="M192,150 L222,180 L222,205.5 L192,175.5 Z" fill="#cbd5f5"/>
  <path d="M252,150 L222,180 L222,205.5 L252,175.5 Z" fill="#dde5ff"/>
  <path d="M222,120 L252,150 L222,180 L192,150 Z M192,150 L222,180 L222,205.5 L192,175.5 Z M252,150 L222,180 L222,205.5 L252,175.5 Z" fill="none" stroke="#8250df" stroke-width="0.8" stroke-linejoin="round"/>
</g></g>
  <g class="cube-b"><g opacity="0.65">
  <path d="M982,290 L1004,312 L982,334 L960,312 Z" fill="#0891b2"/>
  <path d="M960,312 L982,334 L982,352.7 L960,330.7 Z" fill="#cbd5f5"/>
  <path d="M1004,312 L982,334 L982,352.7 L1004,330.7 Z" fill="#dde5ff"/>
  <path d="M982,290 L1004,312 L982,334 L960,312 Z M960,312 L982,334 L982,352.7 L960,330.7 Z M1004,312 L982,334 L982,352.7 L1004,330.7 Z" fill="none" stroke="#0891b2" stroke-width="0.8" stroke-linejoin="round"/>
</g></g>

  <g class="card-float" transform="rotate(-1.4 600 210)">
    <rect x="306" y="80" width="600" height="288" rx="22" fill="#cbd5f5" opacity="0.9"/>
    <rect x="300" y="66" width="600" height="288" rx="22" fill="url(#card-face)" stroke="url(#card-edge)" stroke-width="1.4" filter="url(#card-shadow)"/>
    <g clip-path="url(#card-clip)">
      <rect x="300" y="66" width="600" height="46" fill="#eef2ff" opacity="0.72"/>
      <line x1="300" y1="112" x2="900" y2="112" stroke="#c7d2fe" stroke-opacity="0.75"/>
      <circle cx="328" cy="89" r="5.4" fill="#d1242f"/>
      <circle cx="348" cy="89" r="5.4" fill="#b45309"/>
      <circle cx="368" cy="89" r="5.4" fill="#4d7c0f"/>
      <text class="mono" x="600" y="94" text-anchor="middle" font-size="12" letter-spacing="0.8" fill="#57606a">dika@kendal: ~/profile</text>
      <text class="mono" x="872" y="94" text-anchor="end" font-size="11" fill="#4d7c0f">● main</text>

      <line x1="322" y1="132" x2="322" y2="334" stroke="#0891b2" stroke-opacity="0.25"/>
      <g clip-path="url(#line-0)" class="mono"><text x="342" y="154" font-size="16" fill="#4d7c0f">$</text><text x="362" y="154" font-size="16" fill="#1f2328">whoami</text></g>
<g clip-path="url(#line-1)" class="mono"><text x="342" y="182" font-size="16" fill="#0891b2">&gt;</text><text x="362" y="182" font-size="16" fill="#57606a">full-stack developer — kendal, id</text></g>
<g clip-path="url(#line-2)" class="mono"><text x="342" y="218" font-size="16" fill="#4d7c0f">$</text><text x="362" y="218" font-size="16" fill="#1f2328">cat focus.txt</text></g>
<g clip-path="url(#line-3)" class="mono"><text x="342" y="246" font-size="16" fill="#0891b2">&gt;</text><text x="362" y="246" font-size="16" fill="#57606a">developer tools · telegram bots · web apps</text></g>
<g clip-path="url(#line-4)" class="mono"><text x="342" y="282" font-size="16" fill="#4d7c0f">$</text><text x="362" y="282" font-size="16" fill="#1f2328">echo "open to collaboration"</text></g>
<g clip-path="url(#line-5)" class="mono"><text x="342" y="310" font-size="16" fill="#0891b2">&gt;</text><text x="362" y="310" font-size="16" fill="#4d7c0f">available for selected projects</text></g>

      <g class="mono">
        <text x="342" y="334" font-size="16" fill="#4d7c0f">$</text>
        <rect class="caret" x="362" y="320" width="9" height="17" rx="1.5" fill="#0891b2" opacity="0.9"/>
      </g>

      <rect class="scan" x="300" y="118" width="600" height="16" fill="url(#scan-glow)" opacity="0"/>
      <rect x="300" y="66" width="600" height="288" rx="22" fill="none" stroke="#1f2328" stroke-opacity="0.04"/>
    </g>
  </g>

</g>
</svg>
