<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 300" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Footer — thanks for visiting</title>
<desc id="svg-desc">Layered parallax mountain ridges with a closing thank-you message.</desc>
<defs>

<radialGradient id="footer-aura" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#7c3aed" stop-opacity="0.34"/>
    <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
  </radialGradient>
<linearGradient id="thanks-grad" x1="380" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00f5ff"/>
    <stop offset="0.5" stop-color="#e6edf3"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
<linearGradient id="ridge-front" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
    <stop offset="0.25" stop-color="#00f5ff" stop-opacity="0.55"/>
    <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.55"/>
  </linearGradient>
<filter id="footer-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feFlood flood-color="#00f5ff" flood-opacity="1" result="tint"/>
    <feComposite in="tint" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
