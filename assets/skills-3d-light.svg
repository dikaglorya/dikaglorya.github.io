<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 520" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Dika Glorya — 3D tech stack</title>
<desc id="svg-desc">Nine isometric tech tiles for JavaScript, TypeScript, Python, React, Node.js, Docker, Git, SQL and Linux, floating above soft ground shadows.</desc>
<defs>

<radialGradient id="skills-aura" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#8250df" stop-opacity="0.13"/>
    <stop offset="0.55" stop-color="#0969da" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#eef2ff" stop-opacity="0"/>
  </radialGradient>
<filter id="icon-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
    <feFlood flood-color="#0891b2" flood-opacity="0.7" result="tint"/>
    <feComposite in="tint" in2="blur" operator="in" result="glow"/>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
<filter id="tile-soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
<linearGradient id="tile-js" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7df1e" stop-opacity="0.3"/>
    <stop offset="0.55" stop-color="#f7df1e" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#eef2ff" stop-opacity="0.96"/>
  </linearGradient>
<linearGradient id="tile-ts" x1="0" y1="0" x2="0" y2="1">
